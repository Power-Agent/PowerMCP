[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sienna-mcp"
version = "0.1.0"
description = "MCP server for Sienna (PowerSystems.jl / PowerSimulations.jl), with PLEXOS translation via r2x."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "PowerMCP contributors" }]
dependencies = [
    "mcp>=2,<3",
    # Pin the fixed PLEXOS exporter line rather than the r2x meta-package, whose
    # 2.1.0 dependency graph resolves r2x-plexos 0.2.0 (R2X#299).
    "r2x-sienna>=0.4.0",
    "r2x-plexos>=0.3.0",
    "r2x-sienna-to-plexos>=0.1.0",
]

[project.scripts]
sienna-mcp = "sienna_mcp.main:main"

[tool.setuptools.packages.find]
include = ["sienna_mcp*"]

[tool.setuptools.package-data]
sienna_mcp = ["scripts/*.jl"]
