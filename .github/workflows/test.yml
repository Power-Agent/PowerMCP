name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor of requires-python, and every version the classifiers claim
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # surge-py binds the solver C libraries directly. Ipopt is packaged;
      # HiGHS is not in Ubuntu at all, and the Linux highspy wheel links it
      # statically into _core.so rather than shipping libhighs.so, so it has
      # to be built. The build is cached, so only the first run pays for it.
      - name: Install Ipopt
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libipopt-dev

      - name: Cache HiGHS
        id: highs
        uses: actions/cache@v4
        with:
          path: ~/highs
          key: highs-v1.11.0-${{ runner.os }}

      - name: Build HiGHS
        if: steps.highs.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/ERGO-Code/HiGHS /tmp/HiGHS
          cmake -S /tmp/HiGHS -B /tmp/HiGHS/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=$HOME/highs
          cmake --build /tmp/HiGHS/build -j"$(nproc)"
          cmake --install /tmp/HiGHS/build

      - name: Name the solver libraries
        run: |
          echo "HIGHS_LIB_DIR=$HOME/highs/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/highs/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # [pscad] is psutil, which PSCAD/tests import. [surge] is surge-py,
          # whose marker (>=3.12,<3.15) leaves it uninstalled on 3.10, where the
          # suite skips itself.
          python -m pip install -e ".[pscad,surge]" pytest

      - name: Run tests
        run: >-
          python -m pytest tests/
          PowerFactory/test_state_inspection.py
          PowerFactory/test_component_creation.py
          HOPE/tests
          PSCAD/tests
          PLEXOSDB/tests
          surge/test_integration.py -q
