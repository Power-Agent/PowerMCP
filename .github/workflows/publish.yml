name: Publish to PyPI

# Token-free publishing via PyPI Trusted Publishing (OIDC). No API token/secret
# is stored in the repo. Fires when a GitHub Release is published (tag the commit
# and publish a Release), or retry an existing published release by tag.
#
# One-time setup on PyPI (project already exists, so add a Trusted Publisher):
#   https://pypi.org/manage/project/powermcp/settings/publishing/  ->  Add a new publisher
#     Owner:           Power-Agent
#     Repository:      PowerMCP
#     Workflow name:   publish.yml
#     Environment:     pypi
# Then create a GitHub environment named "pypi" (Settings -> Environments) — optionally
# with required reviewers — and bump `version` in pyproject.toml before each release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & validate distributions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Select the release tag
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$DISPATCH_TAG"
          fi
          if [[ -z "$tag" ]]; then
            echo "A release tag is required" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid tag name: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.candidate.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify the tag, version, and published release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$TAG"
          tag_sha="$(git rev-parse "$TAG^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$tag_sha" ]]; then
            echo "Checked out $head_sha, but $TAG resolves to $tag_sha" >&2
            exit 1
          fi
          remote_sha="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          fi
          if [[ "$remote_sha" != "$tag_sha" ]]; then
            echo "Remote tag $TAG resolves to $remote_sha, not $tag_sha" >&2
            exit 1
          fi

          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

          published_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq 'select(.draft == false and .prerelease == false) | .tag_name')"
          if [[ "$published_tag" != "$TAG" ]]; then
            echo "$TAG is not an existing published non-prerelease GitHub release" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ steps.verify.outputs.sha }}
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
